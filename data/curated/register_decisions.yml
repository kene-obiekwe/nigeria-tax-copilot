about: Review decisions for data/derived/register_candidates.csv (chunking design, section 6). Every candidate has
  an entry, checked against its diff by python/ingest/build_register.py. An entry gives the final type and, for
  substantive and missing_content rows, a note on the legal effect; or merge_into (the candidate is part of another
  row); or drop (the reason). manual_rows are register rows that come from the data-quality log rather than from
  a text difference. Each row was checked against both PDFs before review; review.by and review.on are set only
  after the project owner's review. register_id is pinned once reviewed (D-18); a row added later takes the next
  free number.
review:
  by: Kene
  'on': '2026-10-31'
