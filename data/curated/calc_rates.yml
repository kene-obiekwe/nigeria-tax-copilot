# Rates and thresholds for the calculation tool (Phase 7, D-119, D-120; tools design, section 4.3).
#
# This file is the only source of every rate and threshold that python/tools/taxcalc.py uses. The
# model never passes a rate. Each row ties one constant to the exact words of the cited gazette text:
#
#   id                 the name the calculator uses
#   value              the constant as a decimal string (a percent for `unit: percent`, naira for `unit: naira`)
#   unit               percent | naira
#   act_id, section    where it is printed
#   chunk_id           the corpus chunk that prints it (data/derived/chunks/v1_chunks.jsonl)
#   quote              copied from that chunk's text; it matches after the evidence normaliser (norm/6:
#                      whitespace, dashes, quote marks and case)
#   chunk_text_sha256  the chunk's text_sha256, so a changed corpus fails the tests
#   states             how the tool names the constant to the model (the `relies_on` text)
#
# tests/test_taxcalc.py proves that every quote is in its chunk, that the quote's token equals the
# value, and that every chunk hash matches. The sha256 of this file is pinned in
# python/tools/taxcalc.py (RATES_SHA256) and recorded in eval/tools/config_p7.json.

version: calc/1

# I3: a question that carries any of these marks is not computed (foreign currency). Symbols match
# anywhere; words match as whole words, singular or plural, in any case.
currency_marks:
  symbols: ["$", "£", "€"]
  words: ["USD", "GBP", "EUR", "dollar", "pound", "euro"]

constants:
