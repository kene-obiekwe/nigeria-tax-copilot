# Corrections to cited section headings in data/derived/section_map.csv (DQ-18, D-60).
#
# section_map.csv is derived data and is never hand-edited. The guardrails' heading loader
# (python/generation/guardrails.py, load_section_headings) reads this file and replaces the derived
# heading of each row below. A row applies only while the derived file still holds `derived`
# exactly; if the derived heading changes, loading fails, so a stale correction is never applied.
#
# Two kinds of row:
#
# 1. Page-checked rows (DQ-18, 2026-11-05): each heading was checked against the page image of the
#    cited print. `pdf_page` counts from 1 in the PDF file; `printed_page` is the gazette page
#    number in the header. The headings are the margin notes beside the section in the body of the
#    Act. NTAA sections 24 and 148 were checked the same way on 2026-11-11 (DQ-19): their letters
#    differ from the comparison headings, so they were not letters-equal rows.
# 2. Letters-equal rows (DQ-19, D-126, 2026-11-11), `method: letters_equal`: OCR-joined headings of
#    NTAA sections outside the v1 corpus. The derived heading's letters equal the comparison
#    heading's letters exactly when spaces are ignored (`matches` names the comparison print or
#    prints, Gombe gazette print or National Assembly text, as in section_map.csv), so the
#    correction adds spaces only and changes no other character. No page image was needed. A heading
#    whose letters differ is not corrected here without a page check.

corrections:
  - act_id: ntaa2025
    print: nrs
    section: 37
    derived: "eMakingof assessments oftax in upstream petroleum operations"
    heading: "Making of assessments of tax in upstream petroleum operations"
    source: data/raw/nigeria_tax_administration_act_2025_gazette_nrs.pdf
    pdf_page: 25
    printed_page: "A 283"
    reading: >-
      Margin note beside section 37(1) reads "Making of assessments of tax in upstream petroleum
      operations". The derived text joins OCR noise ("e") and drops two spaces.

