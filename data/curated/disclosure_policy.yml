about: Pinned lists and texts for the answer disclosure rule (D-23 to D-25; generation design, section 5).
  The rule itself is in python/generation/disclosure.py. This file only names the rows that the rule
  treats specially and supplies display texts the register does not have. Every entry gives the
  decision or data-quality id that justifies it. review.by and review.on are set only after the
  project owner's review.
review:
  by: Kene
  'on': 2026-11-02

# Always disclosed, whatever the row type (D-23, need (b)).
always:
  DR-002: DQ-14 printing slip ("treasury Acts", "commercial Acts")
  DR-029: DQ-14 printing slip (Part IX for Part XI of Chapter Two)
  DR-081: DQ-14 printing slip (paragraph 2 of the "Thirtenth" Schedule)
  DR-141: DQ-14 printing slip ("Tenth Schedule securities lending transaction")
  DR-206: cited NRS print omits "a month" in NTAA s29(b)(ii)

# Cross-reference rows: one class, disclosed whatever the type (D-25, need (c)). Every numbering row
# whose note begins "Cross-reference", plus the three wording rows whose difference is a
# cross-reference number.
cross_reference:
  - DR-007
  - DR-008
  - DR-011
  - DR-013
  - DR-014
  - DR-027
  - DR-029
  - DR-032
  - DR-033
  - DR-059
  - DR-061
  - DR-069
  - DR-071
  - DR-081
  - DR-116
  - DR-143
  - DR-198
  - DR-199
  - DR-204
  - DR-224
  - DR-232
  - DR-234

# Shown once, under the row they duplicate (same chunk, same cross-reference; D-25).
merge:
  DR-008: DR-007
  DR-014: DR-013

# Display text for disclosed rows whose register note is empty.
display_text:
  DR-199: "Cross-reference: section 152 of the Nigeria Tax Act (cited) against section 151 (National
    Assembly text, the same section under its numbering, DR-000)."

# Anchor rows (missing_content with no cited reading): shown only when the question names the
# missing term, as a whole phrase, ignoring case (D-23, need (f)).
anchor_terms:
  DR-095: stake
  DR-137: practical ability to control
  DR-262: chief executive officer

# Data-quality notes with no usable register row (D-23, needs (d) and (e)).
notes:
  DQ-16:
    when_cited: nta2025:s191
    text: "As printed, section 191(2) refers objections and appeals to Chapter Four of the Nigeria Tax
      Administration Act 2025. In the cited NRS print of that Act, Chapter Four is Offences and
      Penalties; objections are in Chapter Two (section 41), which Nigeria Tax Act section 10(7)
      cites."
  DQ-12:
    when_question: commencement
    # Shown when the question matches one of these patterns, or the note tagger chooses
    # ntaa_commencement (D-77), and does not name only Acts other than the Administration Act (it
    # names the Administration Act, or no Act). The Acts outside the corpus are the guardrails
    # policy's other_acts list; before D-77 the rule covered only the Nigeria Tax Act.
    patterns:
      - '\bcommenc\w*'
      - '\bcomes? into (?:force|effect|operation)\b'
      - '\bcame into (?:force|effect|operation)\b'
      - '\bin force\b'
      - '\beffective date\b'
      - '\btakes? effect\b'
      - '\btook effect\b'
      - '\bstart(?:s|ed)? to apply\b'
      # Paraphrases added 2026-11-03 (D-39; guardrails design, section 7, weakness (e)).
      - '\bfrom when\b'
      - '\bsince when\b'
      - '\bstart(?:ing)? date\b'
      - '\bbegin(?:s|ning)? to apply\b'
      - '\boperative\b'
      - '\beffective (?:from|on|since)\b'
      - '\bwhen (?:does|did|will) [\w\s]{0,60}\b(?:start|begin|apply|take effect)\b'
      # Commencement-day wording added 2026-11-04 (D-44), written from tuning cases only.
      # G2 fix build 2 (2026-11-07): the D-77 "of the month" guard, also on both D-44 patterns and the second D-56 one.
      - '\b(?:from|on|as (?:of|from)) (?:which|what) (?:day|date)\b(?! of (?:the|each|every|a) (?:month|year|quarter))'
      - '\b(?:which|what) (?:day|date)(?! of (?:the|each|every|a) (?:month|year|quarter)) [\w\s'']{0,60}\b(?:follow|comply|obey|apply|applies|start|begin)\b'
      # Start-of-law wording added 2026-11-05 (D-56; G2 fix design, section 4.2(a)), written from the
      # five notes missed in G2 decision run 1 and the build session's own probes.
      # D-77 (G2 fix design 2, Appendix A): not when followed by "of the month", "of each month"
      # and the like (a due day, not a start date).
      - '\b(?:since|from|on|as of|as from|in|by) (?:which|what) (?:day|date|year|month)\b(?! of (?:the|each|every|a) (?:month|year|quarter))'
      - '\b(?:which|what) (?:day|date|year|month)\b(?! of (?:the|each|every|a) (?:month|year|quarter))[\w\s'']{0,60}\b(?:begin|began|begun|start|started|starts|apply|applies|applied|follow|binding|bind|take effect|took effect|come into effect|in force|into force|operative|become law|became law|be law|live)\b'
      - '\b(?:become|becomes|became|been|is|was|are|were) (?:binding|law|operative|live|enforceable|effective(?! management| tax| rate| date| control))\b'
      - '\b(?:live|in force|binding|operative|effective|enforceable|law) yet\b'
      - '\balready (?:law|in force|binding|operative|effective|live|enforceable)\b'
      - '\bwhen (?:does|did|will|is|was|do|are|were) [\w\s'']{0,60}\b(?:begin|start|apply|binding|bind|take effect|come into effect|in force|into force|operative|become law|be law|live|effective|enforceable)\b'
    # Retrieval trigger (D-39): also shown when one of these chunks is retrieved (the Nigeria Tax
    # Act commencement section and the Administration Act application section), the question has
    # a time word, and it does not name only the Nigeria Tax Act. A false note costs one line; a
    # missed one leaves a known dispute undisclosed.
    retrieved_chunks:
      - nta2025:s203
      - ntaa2025:s2
    time_words: '\b(?:when|date|from|since|year)\b'
    # Period trigger (D-44): also shown when the question names the Administration Act and a date
    # or year before 2026, since whether the Act reaches that period turns on the disputed date. A
    # year printed right after an Act's name ("Act 2025") is not a period.
    period_trigger:
      # D-56: "tax administration" without "Act" also names the Administration Act here.
      act: '\bTax\s+Administration\b|\b(?-i:NTAA)\b'
      period: '(?<!\bAct\s)(?<!\bAct,\s)\b(?:19\d{2}|20(?:[01]\d|2[0-5]))\b(?!\s*(?:Act|Order))'
    text: "The NRS print of the Nigeria Tax Administration Act 2025 gives two commencement dates:
      its long title reads \"[1st Day of January, 2026]\" (page 7), while section 148 says the Act
      \"shall come into effect on the 1st day of January, 2025\" (page 74). Neither provision is in
      the v1 corpus."
